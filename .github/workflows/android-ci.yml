name: Zipspeed Test Build CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-policy:
    name: Project policy / source of truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce Zipspeed permanent rules
        run: npm run project:policy
      - name: Upload project policy evidence
        uses: actions/upload-artifact@v4
        with:
          name: zipspeed-project-policy
          path: artifacts/zipspeed-project-policy
          if-no-files-found: error

  web-build:
    name: Web build
    needs: project-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit canonical UI entry points
        run: npm run ui:audit
      - name: Build web app
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: zipspeed-web-dist
          path: dist
          if-no-files-found: error

  play-console-test-check:
    name: Play Console test gate
    needs: project-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Release-source check
        run: npm run play:check
      - name: Upload Play Console evidence
        uses: actions/upload-artifact@v4
        with:
          name: zipspeed-play-console-evidence
          path: artifacts/zipspeed-play-console-evidence
          if-no-files-found: error

  android-debug:
    name: Android unit + lint + debug APK
    needs: project-policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Unit tests, lint and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zipspeed-v71-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  source-zip:
    name: Clean source ZIP
    needs:
      - project-policy
      - web-build
      - play-console-test-check
      - android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload verified clean source package
        uses: actions/upload-artifact@v4
        with:
          name: Zipspeed-v71-source
          path: |
            .env.example
            .github
            PROJECT_WORKFLOW.md
            ใช้แชทสร้างแอพอัปโหลดอัตโนมัติ.txt
            README.md
            README_TH.md
            IMPLEMENTATION_STATUS.md
            PLAY_CONSOLE_TEST_GATE.md
            PLAY_STORE_FEATURES.md
            PLAY_STORE_RELEASE_AUDIT.md
            QUALITY_AUDIT_TH.md
            UI_REDESIGN_NOTES.md
            DATA_SAFETY_WORKSHEET.md
            app
            public
            scripts
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
            build.mjs
            server.mjs
            package.json
            metadata.json
            play-console-check.mjs
          if-no-files-found: error
          retention-days: 30

  android-signed-release:
    name: Signed release AAB
    if: ${{ vars.ENABLE_SIGNED_RELEASE == 'true' }}
    needs: project-policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Validate signing inputs
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "KEYSTORE_BASE64 missing" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "STORE_PASSWORD missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD missing" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
      - name: Build signed release bundle
        run: gradle --no-daemon :app:bundleRelease
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: zipspeed-v71-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
